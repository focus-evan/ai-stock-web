name: Deploy main to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm test -- --run
        continue-on-error: true

      - name: Type check
        run: pnpm typecheck

      - name: Build project
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy main backend when repository changed
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -s' << 'EOF'
            set -e
            BACKEND_DIR="/data/ai-stock-main/ai-stock"
            if [ ! -d "${BACKEND_DIR}/.git" ]; then
              echo "Backend checkout not found: ${BACKEND_DIR}"
              exit 1
            fi

            cd "${BACKEND_DIR}"
            git fetch origin main
            CURRENT_SHA="$(git rev-parse HEAD)"
            TARGET_SHA="$(git rev-parse origin/main)"
            if [ "${CURRENT_SHA}" != "${TARGET_SHA}" ]; then
              bash ./restart-main.sh
            else
              echo "Main backend is already current (${CURRENT_SHA})."
            fi
          EOF

      - name: Backup main frontend
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            if [ -d "/var/www/html/financial-data-platform-main" ]; then
              mkdir -p /data/backups/ai-stock-web-main
              timestamp=$(date +%Y%m%d_%H%M%S)
              tar -czf /data/backups/ai-stock-web-main/main_${timestamp}.tar.gz \
                -C /var/www/html/financial-data-platform-main . 2>/dev/null || true

              cd /data/backups/ai-stock-web-main
              ls -t main_*.tar.gz | tail -n +6 | xargs -r rm
            fi
          EOF

      - name: Deploy main frontend
        run: |
          rsync -avz --delete \
            -e "ssh" \
            build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/html/financial-data-platform-main/

      - name: Set permissions
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            chown -R www-data:www-data /var/www/html/financial-data-platform-main
            chmod -R 755 /var/www/html/financial-data-platform-main
          EOF

      - name: Reload Nginx
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "systemctl reload nginx"

      - name: Health check
        run: |
          curl --fail --retry 6 --retry-delay 5 \
            http://${{ secrets.SERVER_HOST }}:3667/
          curl --fail --retry 6 --retry-delay 5 \
            http://${{ secrets.SERVER_HOST }}:3667/api/strategy/combined/watchlist/unwind-plans

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 URL: http://${{ secrets.SERVER_HOST }}:3667"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs for details."
